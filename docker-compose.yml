# medialab workspace compose.
#
# Torrent traffic lives inside one network namespace owned by gluetun, the VPN
# client: qBittorrent and torrent-downloader both join it with
# network_mode: service:gluetun, so their only route out is the WireGuard
# tunnel and a dropped tunnel means no route at all. The other services share
# the compose network and reach the downloader through gluetun's service name.
# Jellyfin stays a host app reached over host.docker.internal.
#
# Each medialab service keeps its own .env (per-service env_file below); there
# is no shared service .env. Compose itself interpolates the values in the root
# .env (see .env.example): the host media root, the compose subnet, the
# qBittorrent WebUI port. The VPN provider settings live in gluetun/vpn.env.
#
# Per-service *_VERSION vars tag the built images and stamp APP_VERSION into each
# build (hatch-vcs version + OCI image.version label). They are generated from the
# pinned submodules' git tags by bin/medialab-versions.sh into .versions.env
# (gitignored); run bin/medialab-build.sh to regenerate + build. Absent the file,
# the ':-dev' fallbacks keep a bare 'docker compose build' working. gluetun and
# qbittorrent are pulled third-party images with no build key; bin/lib.sh keeps
# them out of the version tooling.

name: medialab

services:
  gluetun:
    # VPN client and firewall. Provider, keys and server filters come from
    # gluetun/vpn.env; nothing provider-specific lives in this file. Switching
    # providers is editing that file and running `docker compose up -d`.
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ./gluetun/vpn.env
    environment:
      # The compose subnet is the one non-tunnel destination allowed, so the
      # completion hook can reach the orchestrator and the orchestrator can
      # reach the downloader. Must not overlap the provider's tunnel range.
      FIREWALL_OUTBOUND_SUBNETS: ${MEDIALAB_SUBNET:-172.28.77.0/24}
      TZ: ${TZ:-UTC}
    ports:
      # qBittorrent WebUI for the operator, loopback only. Everything that
      # listens inside the namespace is published here, on gluetun.
      - "127.0.0.1:${QBT_WEBUI_PORT:-8090}:8080"
    networks:
      - internal
    restart: unless-stopped

  qbittorrent:
    # Shares gluetun's namespace: no ports, no networks of its own. The config
    # directory is a bind mount so bin/medialab-qbt-provision.sh can seed the
    # API key before first start.
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    network_mode: "service:gluetun"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
      WEBUI_PORT: "8080"
    volumes:
      - "./qbittorrent/config:/config"
      # Same host directory the orchestrator mounts, at the same path, so the
      # save path the downloader hands over needs no translation.
      - "${MEDIA_HOST_DIR}:/media"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  torrent-downloader:
    # Also inside gluetun's namespace: qBittorrent is 127.0.0.1:8080, DNS is
    # gluetun's DNS-over-TLS forwarder, TMDB and details-page fetches leave
    # through the tunnel. Listens on 8001 (gluetun's control server owns 8000)
    # and is addressed by the orchestrator as http://gluetun:8001.
    build:
      context: ./torrent-downloader
      args:
        APP_VERSION: ${TORRENT_DOWNLOADER_VERSION:-dev}
    image: medialab/torrent-downloader:${TORRENT_DOWNLOADER_VERSION:-dev}
    network_mode: "service:gluetun"
    env_file:
      - ./torrent-downloader/.env
    volumes:
      # diskcache store: the hash -> {media_type, host_path, tmdb_id} entries
      # the orchestrator reads at completion, plus TMDB/search caches. Without
      # a volume every image rebuild wiped it and long downloads 404'd at
      # RESOLVE_META. Path matches CACHE_DIRECTORY=.cache under WORKDIR /app.
      - "downloader-cache:/app/.cache"
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    restart: unless-stopped

  medialab-jellyfin:
    build:
      context: ./medialab-jellyfin
      args:
        APP_VERSION: ${MEDIALAB_JELLYFIN_VERSION:-dev}
    image: medialab/medialab-jellyfin:${MEDIALAB_JELLYFIN_VERSION:-dev}
    env_file:
      - ./medialab-jellyfin/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    restart: unless-stopped

  medialab-orchestrator:
    build:
      context: ./medialab-orchestrator
      args:
        APP_VERSION: ${MEDIALAB_ORCHESTRATOR_VERSION:-dev}
    image: medialab/medialab-orchestrator:${MEDIALAB_ORCHESTRATOR_VERSION:-dev}
    env_file:
      - ./medialab-orchestrator/.env
    ports:
      # Loopback only: the bot and the web UI reach the gateway over the compose
      # network, the completion hook from inside gluetun's namespace. Nothing
      # on the LAN or Meshnet needs it; the web UI (8081) is the remote surface.
      - "127.0.0.1:8000:8000"
    volumes:
      # Shared media volume: the orchestrator renames through this mount
      # (MEDIA_MOUNT_PATH=/media in its .env); qBittorrent writes the same
      # directory at the same path.
      - "${MEDIA_HOST_DIR}:/media"
      # Persist the SQLite job store across restarts.
      - "orchestrator-data:/app/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - torrent-downloader
      - medialab-jellyfin
    networks:
      - internal
    restart: unless-stopped

  medialab-bot:
    build:
      context: ./medialab-bot
      args:
        APP_VERSION: ${MEDIALAB_BOT_VERSION:-dev}
    image: medialab/medialab-bot:${MEDIALAB_BOT_VERSION:-dev}
    env_file:
      - ./medialab-bot/.env
    # DNS deliberately follows Docker's embedded resolver (and so the host).
    # Pinning public resolvers here (1.1.1.1 / 8.8.8.8) was tried on 2026-08-17
    # to survive host VPN tunnels cycling; with a VPN that blocks direct
    # UDP/53 egress from containers it instead broke every Discord lookup and
    # crash-looped the bot (2026-09-19). Only the host's resolver tracks the
    # host's VPN state, so the bot must not override it.
    depends_on:
      - medialab-orchestrator
    networks:
      - internal
    restart: unless-stopped

  medialab-web:
    build:
      context: ./medialab-web
      args:
        APP_VERSION: ${MEDIALAB_WEB_VERSION:-dev}
    image: medialab/medialab-web:${MEDIALAB_WEB_VERSION:-dev}
    env_file:
      - ./medialab-web/.env
    ports:
      # Browser UI; a second thin client of the gateway beside the bot.
      - "8081:8080"
    depends_on:
      - medialab-orchestrator
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    # Fixed so gluetun's FIREWALL_OUTBOUND_SUBNETS can name it.
    ipam:
      config:
        - subnet: ${MEDIALAB_SUBNET:-172.28.77.0/24}

volumes:
  orchestrator-data:
  downloader-cache:
