# Reusable tag-driven release for every medialab Python repo.
#
# Callers trigger on `push: tags: ["v*"]` and invoke this workflow. It refuses
# to publish unless CHANGELOG.md already carries a dated heading for the tag
# and the Unreleased section is empty, then creates the GitHub Release with
# that section as its notes. The git tag stays the single source of truth for
# the version; the changelog is the single source of truth for the notes.
name: Release (reusable)

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog section for this tag
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          heading_re="^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"
          if ! grep -Eq "$heading_re" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated heading for ${version}." >&2
            exit 1
          fi
          # Unreleased must be empty: anything between its heading and the next
          # heading that is not blank means the release was cut too early.
          unreleased="$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -vE '^\s*$' || true)"
          if [ -n "$unreleased" ]; then
            echo "CHANGELOG.md Unreleased section is not empty:" >&2
            echo "$unreleased" >&2
            exit 1
          fi
          awk -v re="$heading_re" '$0 ~ re {f=1;next} /^## \[/{f=0} f' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
